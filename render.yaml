# Render "Blueprint": one click creates the server and its database from this file.
databases:
  - name: skillmatch-db
    plan: free
    databaseName: skillmatch
    user: skillmatch

services:
  - type: web
    name: skillmatch-server
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: skillmatch-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # DEMO ONLY: shows sign-up and reset codes in the app instead of emailing them.
      # Anyone can then create accounts or reset passwords. Set to 0 and add SMTP_* before real students use it.
      - key: DEV_ECHO_OTP
        value: "1"
      - key: SEED_DEMO
        value: "1"
      # Asked for when you create the Blueprint. This becomes the admin login for /admin.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
